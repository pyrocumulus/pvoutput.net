name: Codecov

on: 
  push:
    branches-ignore:
      - gh-pages
    paths-ignore:
      - 'docfx/**'

jobs:
  test_and_upload_coverage:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # request the GitHub OIDC token Codecov uses to authenticate uploads

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x
        dotnet-quality: 'ga'  
    - name: Install libssl
      run: sudo apt-get update && sudo apt-get install -y libssl-dev
    - name: Test with dotnet
      run: dotnet test --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=opencover
    - name: Code coverage
      uses: codecov/codecov-action@v7
      with:
        # Uploads to protected branches (develop, main) need authentication
        use_oidc: true
        fail_ci_if_error: true

