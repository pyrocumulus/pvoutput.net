name: publish to nuget
on:
  push:
    branches:
      - main # Default release branch
jobs:
  publish:
    name: build, pack & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
      id-token: write # request the GitHub OIDC token for NuGet trusted publishing
    env:
      PROJECT_FILE_PATH: src/PVOutput.Net/PVOutput.Net.csproj
      PACKAGE_NAME: PVOutput.Net
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x
          dotnet-quality: 'ga'

      # Only publish when the project version is not on nuget.org yet
      - name: Check for version change
        id: version
        run: |
          VERSION=$(dotnet msbuild "$PROJECT_FILE_PATH" -getProperty:Version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PACKAGE_ID=$(echo "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')
          if curl -sf "https://api.nuget.org/v3-flatcontainer/$PACKAGE_ID/index.json" \
              | jq -e --arg v "${VERSION,,}" '.versions | index($v)' > /dev/null; then
            echo "Version $VERSION is already published, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is new, publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: dotnet pack "$PROJECT_FILE_PATH" --configuration Release --output ./nupkgs

      # Get a short-lived NuGet API key via trusted publishing
      - name: NuGet login (OIDC → temp API key)
        if: steps.version.outputs.publish == 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .nupkg; the matching .snupkg symbols package is pushed along with it
      - name: NuGet push
        if: steps.version.outputs.publish == 'true'
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag commit
        if: steps.version.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
