name: .NET build

on: 
  push:
    branches-ignore:
      - gh-pages
    paths-ignore:
      - 'docfx/**'

jobs:
  build_and_test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x
        dotnet-quality: 'ga'        
    - name: Build with dotnet
      run: dotnet build --configuration Release
    - name: Test with dotnet
      run: dotnet test
    - name: Test .NET Standard 2.0 build with dotnet
      run: dotnet test --framework net8.0 -p:LibraryTargetFramework=netstandard2.0

